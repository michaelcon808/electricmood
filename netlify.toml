# Fully static deploy: Netlify just serves the /out folder. No functions, no server.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Node version also pinned in .nvmrc
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # This is a static export: skip Netlify's Next.js server runtime plugin.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  # Google Analytics 4 Measurement ID (public, not a secret). Remove this line to switch analytics off.
  NEXT_PUBLIC_GA_MEASUREMENT_ID = "G-9XQLBJE6W2"

# Hashed build assets never change: cache forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
